name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Юнит-тесты плагинов и скриптов-стражей (stdlib unittest, без зависимостей).
      # Каждый test_*.py сам добавляет свой каталог в sys.path — запускаем по пути.
      - name: unit tests
        run: |
          set -e
          for t in $(find plugins scripts -name 'test_*.py' | sort); do
            echo "== $t"
            python3 "$t"
          done

      # Запрет верхнеуровневого ключа hooks в plugin.json (локальный страж
      # scripts/check_manifests.py, тот же вызов — из корня репозитория).
      - name: manifest guard
        run: python3 scripts/check_manifests.py

      - name: builtin provider guard
        run: python3 scripts/check_builtin_providers.py

      # Вне hooks путь к ресурсам плагина приходит только подстановкой:
      # команда или скилл не читает CLAUDE_PLUGIN_ROOT во время работы.
      - name: plugin root substitution guard
        run: python3 scripts/check_plugin_root_usage.py

      # Запрет зеркала манифестов в docs/: версия рядом с именем плагина
      # обязана совпадать с plugin.json, колонки состава в каталоге запрещены.
      - name: docs plugin-mirror guard
        run: python3 scripts/check_docs_plugins.py

      # Числа наблюдённого прогона (стоимость, оценки) в docs/ не переносятся:
      # они живут в aggregate-result.json, который git не отслеживает, и в
      # документации устаревают молча.
      - name: docs run-number guard
        run: python3 scripts/check_docs_run_numbers.py

      # Приёмочный smoke: уровни зрелости seed-сводов не должны съезжать с калибровки.
      - name: maturity smoke — seed swords keep calibrated level
        run: |
          set -e
          m=plugins/fpf-integration/skills/dpf-authoring/assets/maturity.py
          bank=plugins/fpf-competency-bank/frameworks
          got_dpf=$(python3 "$m" "$bank/DPF-COUPLING-GENERALIZATION" --json | python3 -c "import sys,json;print(json.load(sys.stdin)['level'])")
          got_lpf=$(python3 "$m" "$bank/LPF-SIMPLIFICATION-REVIEW" --json | python3 -c "import sys,json;print(json.load(sys.stdin)['level'])")
          echo "DPF-COUPLING=$got_dpf  LPF-SIMPLIFICATION=$got_lpf"
          test "$got_dpf" = "L1" || { echo "::error::DPF-COUPLING ожидался L1, получен $got_dpf"; exit 1; }
          test "$got_lpf" = "L2" || { echo "::error::LPF-SIMPLIFICATION ожидался L2, получен $got_lpf"; exit 1; }

      # Инвариант: скрипт зрелости не пишет в DPF.md сводов (только на чтение).
      - name: invariant — maturity read-only run leaves seed DPF.md untouched
        run: |
          set -e
          m=plugins/fpf-integration/skills/dpf-authoring/assets/maturity.py
          bank=plugins/fpf-competency-bank/frameworks
          python3 "$m" "$bank/DPF-COUPLING-GENERALIZATION" >/dev/null
          python3 "$m" "$bank/LPF-SIMPLIFICATION-REVIEW" >/dev/null
          changed=$(git status --porcelain -- 'plugins/fpf-competency-bank/frameworks/*/DPF.md')
          test -z "$changed" || { echo "::error::seed DPF.md изменён прогоном maturity.py:"; echo "$changed"; exit 1; }

  # Сборка документации Zensical. Публикация на master остаётся в docs.yml;
  # здесь только проверка, что docs/ собираются. Запускается на любых push/PR
  # без фильтрации путей: отказ — дефект сборки, а не факт правки docs/.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Полнота явного project.nav: каждый docs/**/*.md присутствует в списке
      # ровно раз, лишних целей нет. До сборки: забытая страница — дефект
      # навигации, а не сборки.
      - name: navigation completeness
        run: python3 scripts/check_docs_nav.py

      # --strict обязателен: без него сломанная ссылка или якорь — лишь Warning
      # с кодом выхода 0, и сборка проходит с битой документацией.
      - run: pip install zensical
      - run: zensical build --clean --strict

  manifests:
    runs-on: ubuntu-latest
    env:
      DISABLE_UPDATES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install pinned Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.234
          test "$(claude --version | cut -d' ' -f1)" = "2.1.234"

      # Каждый plugin.json и marketplace-манифест — валидный JSON.
      - name: plugin.json + marketplace manifests are valid JSON
        run: |
          set -e
          for f in $(find plugins -path '*/.claude-plugin/plugin.json') .claude-plugin/marketplace.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

      # Корень плагина проверяет манифест; frontmatter компонентов проверяется
      # только при отдельной передаче каталогов commands, skills и agents.
      - name: plugin structure and component frontmatter
        run: |
          set -euo pipefail
          claude plugin validate .claude-plugin/marketplace.json --strict
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin=${manifest%/.claude-plugin/plugin.json}
            claude plugin validate "$plugin" --strict
            for components in commands skills agents; do
              [ ! -d "$plugin/$components" ] || \
                claude plugin validate "$plugin/$components" --strict
            done
          done

  workflow-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: workflow input guard
        run: node plugins/planner/workflows/test_plan_do_workflow_inputs.mjs

      - name: calque sweep report contract
        run: node plugins/clarity-language/workflows/test_calque_sweep_contract.mjs
